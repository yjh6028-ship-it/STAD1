<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STAD 모형 영어 퀴즈 앱</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #f3f4f6; }
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // ★★★ 이 부분에 API 키를 정확히 넣어주세요 ★★★
        const apiKey = "AIzaSyBxP5wkb061NXVeSa1vThbG3zfACKOm_GA"; 

        const PASSAGE = `Nearly everything has to go through your mouth to get to the rest of you, from food and air to bacteria and viruses. A healthy mouth can help your body get what it needs and prevent it from harm — with adequate space for air to travel to your lungs, and healthy teeth and gums that prevent harmful microorganisms from entering your bloodstream. From the moment you are created, oral health affects every aspect of your life. What happens in the mouth is usually just the tip of the iceberg and a reflection of what is happening in other parts of the body. Poor oral health can be a cause of a disease that affects the entire body. The microorganisms in an unhealthy mouth can enter the bloodstream and travel anywhere in the body, posing serious health risks.`;

        const App = () => {
            const [student, setStudent] = useState({ id: '', name: '' });
            const [appState, setAppState] = useState('LOGIN');
            const [questions, setQuestions] = useState([]);
            const [currentQIndex, setCurrentQIndex] = useState(0);
            const [userAnswers, setUserAnswers] = useState([]);
            const [history, setHistory] = useState([]);
            const [errorMsg, setErrorMsg] = useState("");

            const generateQuestions = async () => {
                setAppState('LOADING');
                setErrorMsg("");
                
                const prompt = `영어 지문 기반 10문제 생성. JSON 형식으로만 응답. 유형: 내용, 주제, 어휘, 어법 골고루. 4지선다. 지문: ${PASSAGE}`;

                // 가장 안정적인 gemini-1.5-flash 모델 사용
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
                
                const payload = {
                    contents: [{ parts: [{ text: prompt }] }],
                    generationConfig: {
                        responseMimeType: "application/json",
                        responseSchema: {
                            type: "OBJECT",
                            properties: {
                                questions: {
                                    type: "ARRAY",
                                    items: {
                                        type: "OBJECT",
                                        properties: {
                                            type: { type: "STRING" },
                                            question: { type: "STRING" },
                                            options: { type: "ARRAY", items: { type: "STRING" } },
                                            answerIndex: { type: "INTEGER" },
                                            explanation: { type: "STRING" }
                                        },
                                        required: ["type", "question", "options", "answerIndex", "explanation"]
                                    }
                                }
                            },
                            required: ["questions"]
                        }
                    }
                };

                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.error?.message || "API 호출 실패");
                    }

                    const data = await response.json();
                    const responseText = data.candidates[0].content.parts[0].text;
                    const parsed = JSON.parse(responseText);
                    
                    setQuestions(parsed.questions);
                    setCurrentQIndex(0);
                    setUserAnswers([]);
                    setAppState('QUIZ');
                } catch (err) {
                    console.error(err);
                    setErrorMsg("API 키가 잘못되었거나 서버 응답에 문제가 있습니다: " + err.message);
                    setAppState('ERROR');
                }
            };

            const handleLogin = (e) => {
                e.preventDefault();
                if (student.id.trim() === '' || student.name.trim() === '') {
                    alert("학번과 이름을 입력해주세요.");
                    return;
                }
                generateQuestions();
            };

            const handleAnswerSelect = (index) => {
                const newAnswers = [...userAnswers, index];
                setUserAnswers(newAnswers);
                if (currentQIndex < questions.length - 1) {
                    setCurrentQIndex(prev => prev + 1);
                } else {
                    let score = 0;
                    questions.forEach((q, idx) => { if (q.answerIndex === newAnswers[idx]) score += 10; });
                    setHistory(prev => [...prev, score]);
                    setAppState('RESULT');
                }
            };

            const getStadStats = () => {
                const currentScore = history[history.length - 1] || 0;
                if (history.length < 2) return { canCalculate: false, currentScore };
                const previousScores = history.slice(0, -1);
                const baseScore = Math.round(previousScores.reduce((a, b) => a + b, 0) / previousScores.length);
                const diff = currentScore - baseScore;
                let stadScore = currentScore === 100 || diff > 10 ? 30 : diff >= 0 ? 20 : diff >= -10 ? 10 : 0;
                return { canCalculate: true, currentScore, baseScore, diff, stadScore };
            };

            if (appState === 'LOGIN') return (
                <div className="min-h-screen flex items-center justify-center p-4">
                    <div className="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md fade-in text-center">
                        <h1 className="text-3xl font-bold text-blue-600 mb-6">STAD 퀴즈 학습</h1>
                        <form onSubmit={handleLogin} className="space-y-4">
                            <input type="text" placeholder="학번 (예: 10101)" className="w-full px-4 py-3 rounded-lg border" value={student.id} onChange={(e) => setStudent({...student, id: e.target.value})} />
                            <input type="text" placeholder="이름" className="w-full px-4 py-3 rounded-lg border" value={student.name} onChange={(e) => setStudent({...student, name: e.target.value})} />
                            <button type="submit" className="w-full bg-blue-600 text-white font-bold py-3 rounded-lg">시작하기</button>
                        </form>
                    </div>
                </div>
            );

            if (appState === 'LOADING') return (
                <div className="min-h-screen flex flex-col items-center justify-center p-4">
                    <div className="animate-spin rounded-full h-16 w-16 border-t-4 border-blue-600 mb-4"></div>
                    <h2 className="text-xl font-bold">AI 퀴즈 생성 중...</h2>
                </div>
            );

            if (appState === 'ERROR') return (
                <div className="min-h-screen flex flex-col items-center justify-center p-4">
                    <div className="bg-red-50 text-red-700 p-8 rounded-2xl border border-red-200 text-center shadow-lg">
                        <i className="fas fa-exclamation-circle text-5xl mb-4 text-red-500"></i>
                        <h2 className="text-2xl font-bold mb-4">오류가 발생했습니다</h2>
                        <p className="mb-6 whitespace-pre-wrap">{errorMsg}</p>
                        <button onClick={() => setAppState('LOGIN')} className="bg-red-600 text-white px-8 py-3 rounded-lg font-bold">다시 시도</button>
                    </div>
                </div>
            );

            if (appState === 'QUIZ') {
                const q = questions[currentQIndex];
                return (
                    <div className="min-h-screen bg-gray-100 p-4 flex flex-col items-center">
                        <div className="w-full max-w-4xl bg-white rounded-2xl shadow-lg overflow-hidden flex flex-col h-[90vh]">
                            <div className="bg-blue-600 p-4 text-white flex justify-between font-bold">
                                <span>{student.id} {student.name}</span>
                                <span>문제 {currentQIndex + 1} / 10</span>
                            </div>
                            <div className="p-6 grid grid-cols-1 md:grid-cols-2 gap-6 overflow-y-auto">
                                <div className="bg-gray-50 p-4 rounded-lg border text-lg leading-relaxed">{PASSAGE}</div>
                                <div>
                                    <div className="bg-blue-100 text-blue-800 px-3 py-1 rounded-full text-sm font-bold mb-2 w-max">{q.type}</div>
                                    <h2 className="text-xl font-bold mb-6">{q.question}</h2>
                                    <div className="space-y-3">
                                        {q.options.map((opt, idx) => (
                                            <button key={idx} onClick={() => handleAnswerSelect(idx)} className="w-full text-left p-4 rounded-xl border-2 hover:border-blue-500 hover:bg-blue-50 transition">
                                                <span className="font-bold mr-2">{idx + 1}.</span> {opt}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            if (appState === 'RESULT') {
                const stats = getStadStats();
                return (
                    <div className="min-h-screen bg-gray-100 p-4 flex flex-col items-center overflow-y-auto">
                        <div className="max-w-4xl w-full space-y-4">
                            <div className="bg-white p-6 rounded-2xl shadow text-center">
                                <h2 className="text-2xl font-bold mb-4">{student.name}님의 성적 결과</h2>
                                <div className="grid grid-cols-3 gap-4">
                                    <div className="p-4 bg-gray-50 rounded-lg">
                                        <div className="text-gray-500 text-sm">현재 점수</div>
                                        <div className="text-2xl font-bold">{stats.currentScore}</div>
                                    </div>
                                    <div className="p-4 bg-gray-50 rounded-lg">
                                        <div className="text-gray-500 text-sm">이전 평균</div>
                                        <div className="text-2xl font-bold">{stats.canCalculate ? stats.baseScore : '-'}</div>
                                    </div>
                                    <div className="p-4 bg-blue-600 text-white rounded-lg">
                                        <div className="text-blue-100 text-sm">STAD 점수</div>
                                        <div className="text-2xl font-bold">{stats.canCalculate ? stats.stadScore : '진단중'}</div>
                                    </div>
                                </div>
                                <button onClick={generateQuestions} className="mt-6 bg-blue-600 text-white px-6 py-2 rounded-lg font-bold">다시 풀기</button>
                            </div>
                            <div className="bg-white p-6 rounded-2xl shadow space-y-6">
                                {questions.map((q, idx) => (
                                    <div key={idx} className="border-b pb-4">
                                        <div className="font-bold mb-2">Q{idx+1}. {q.question}</div>
                                        <div className="text-sm text-blue-600 bg-blue-50 p-3 rounded">정답: {q.options[q.answerIndex]}<br/>해설: {q.explanation}</div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                );
            }
            return null;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
